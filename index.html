<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#eef1f6">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>가계부</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --ink:#191f28; --sub:#6b7684; --line:#e8ecf1;
    --blue:#3182f6; --violet:#7c5cf0; --red:#f04452;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 60% at 0% 0%, #dfe8ff 0%, rgba(223,232,255,0) 55%),
      radial-gradient(120% 60% at 100% 0%, #f3e6ff 0%, rgba(243,230,255,0) 50%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    display:flex;align-items:center;justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  }
  .lock{width:100%;max-width:380px}
  .brand{text-align:center;margin-bottom:20px}
  .brand .eyebrow{font-size:11.5px;font-weight:800;color:var(--blue);letter-spacing:.09em}
  .brand h1{margin:7px 0 6px;font-size:27px;line-height:1.25;letter-spacing:-0.03em}
  .brand p{margin:0;font-size:13px;color:var(--sub);line-height:1.5}
  .card{background:var(--card);border-radius:22px;padding:22px 20px 18px;
        box-shadow:0 10px 30px rgba(25,31,40,.08),0 1px 2px rgba(25,31,40,.05)}
  .card.shake{animation:shake .32s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)} 40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }
  label.f{display:block;font-size:12px;font-weight:800;color:#333d4b;margin:0 0 7px}
  .pinrow{position:relative}
  .pinrow input{
    width:100%;border:1px solid var(--line);background:#f7f9fc;border-radius:16px;
    padding:16px 16px;font-size:22px;font-weight:800;letter-spacing:.42em;
    text-align:center;color:var(--ink);outline:none;font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .pinrow input::placeholder{letter-spacing:.42em;color:#c3cad5;font-weight:700}
  .pinrow input:focus{border-color:#c8d7f5;background:#fff;box-shadow:0 0 0 3px rgba(49,130,246,.1)}
  .pinrow input.bad{border-color:#f7b8bd;background:#fff6f7}
  .go{
    width:100%;margin-top:12px;border:0;border-radius:16px;padding:16px;
    background:linear-gradient(135deg,#3b87f7,#7c5cf0);color:#fff;
    font-size:15.5px;font-weight:800;letter-spacing:-0.01em;font-family:inherit;
    box-shadow:0 8px 18px rgba(49,130,246,.26);cursor:pointer;
  }
  .go:disabled{opacity:.6}
  .go:active{transform:translateY(1px)}
  .msg{min-height:20px;margin:10px 2px 0;font-size:12.5px;font-weight:700;color:var(--red);line-height:1.45}
  .msg.info{color:var(--sub)}
  .toggle{display:flex;align-items:center;gap:11px;margin-top:14px;padding-top:15px;border-top:1px solid var(--line)}
  .toggle .t{flex:1;min-width:0}
  .toggle .t b{display:block;font-size:13px;font-weight:800;letter-spacing:-0.01em}
  .toggle .t span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.4}
  .sw{position:relative;width:46px;height:28px;flex:none}
  .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .sw i{position:absolute;inset:0;border-radius:99px;background:#dfe4ec;transition:background .18s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(25,31,40,.25);transition:transform .18s}
  .sw input:checked + i{background:var(--blue)}
  .sw input:checked + i::after{transform:translateX(18px)}
  .foot{margin-top:16px;text-align:center;font-size:11px;color:#9aa4b2;line-height:1.7}
  .foot b{color:#6b7684;font-weight:700}
</style>
</head>
<body>
<main class="lock">
  <div class="brand">
    <div class="eyebrow">MONTHLY BUDGET</div>
    <h1>가계부</h1>
    <p>비밀번호를 입력하면 이번 달 내역이 열려요.</p>
  </div>
  <form class="card" id="card" autocomplete="off">
    <label class="f" for="pin">비밀번호</label>
    <div class="pinrow">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="12" placeholder="••••" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="비밀번호">
    </div>
    <button class="go" id="go" type="submit">잠금 해제</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="toggle">
      <div class="t">
        <b>이 기기에서 비밀번호 기억하기</b>
        <span>다음부터 열 때 바로 보여요.</span>
      </div>
      <label class="sw"><input type="checkbox" id="remember" aria-label="이 기기에서 비밀번호 기억하기"><i></i></label>
    </div>
  </form>
  <div class="foot">
    <b>AES-256-GCM</b> 암호화 · 잠금 해제는 이 기기 안에서만 이뤄져요
  </div>
</main>

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "budget.pin.v1";
  var form = document.getElementById("card");
  var input = document.getElementById("pin");
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");
  var remember = document.getElementById("remember");
  var fails = 0;
  var busy = false;

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function say(text, info) {
    msg.textContent = text || "";
    msg.className = "msg" + (info ? " info" : "");
  }

  function fail() {
    fails++;
    form.classList.remove("shake");
    void form.offsetWidth;
    form.classList.add("shake");
    input.classList.add("bad");
    input.value = "";
    if (fails < 3) {
      input.focus();
      say("비밀번호가 맞지 않아요. 다시 입력해 주세요.");
      return;
    }
    var wait = Math.min(5, fails - 2);
    input.disabled = true; btn.disabled = true;
    say("잠시 후 다시 시도해 주세요 (" + wait + "초)", true);
    setTimeout(function () {
      input.disabled = false; btn.disabled = false; busy = false;
      say("");
      input.focus();
    }, wait * 1000);
  }

  async function derive(pin) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(P.kdf.salt), iterations: P.kdf.iterations, hash: P.kdf.hash },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
  }

  async function unlock(pin, fromStore) {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    input.classList.remove("bad");
    if (!fromStore) say("확인 중…", true);
    try {
      if (!window.crypto || !crypto.subtle) throw new Error("no-webcrypto");
      var key = await derive(pin);
      var buf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(P.cipher.iv), tagLength: 128,
          additionalData: new TextEncoder().encode("budget-2026-11") }, key, b64(P.data)
      );
      var html = new TextDecoder("utf-8").decode(buf);
      try {
        if (remember.checked) localStorage.setItem(KEY, btoa(unescape(encodeURIComponent(pin))));
        else localStorage.removeItem(KEY);
      } catch (e) {}
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (err) {}
      busy = false;
      btn.disabled = false;
      if (e && e.message === "no-webcrypto") {
        say("이 브라우저에서는 열 수 없어요. https 주소로 다시 열어 주세요.");
        return;
      }
      fail();
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pin = input.value.trim();
    if (!pin) { say("비밀번호를 입력해 주세요."); input.focus(); return; }
    unlock(pin, false);
  });

  input.addEventListener("input", function () {
    input.value = input.value.replace(/[^0-9]/g, "");
    if (input.classList.contains("bad")) { input.classList.remove("bad"); say(""); }
  });

  input.addEventListener("focus", function () { say(""); });

  (function boot() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (!saved) { say(""); return; }
    remember.checked = true;
    input.value = "••••";
    say("저장된 비밀번호로 여는 중…", true);
    var pin = "";
    try { pin = decodeURIComponent(escape(atob(saved))); } catch (e) { pin = ""; }
    if (!pin) { say(""); return; }
    unlock(pin, true);
  })();
})();
</script>
</body>
</html>
